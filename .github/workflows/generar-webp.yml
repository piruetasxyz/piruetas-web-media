name: Generar previews webp

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "**/jpg/*.jpg"
      - "**/jpg/*.jpeg"
      - "scripts/generar-webp.sh"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Generar webp desde jpg
        run: ./scripts/generar-webp.sh

      - name: Commitear webp generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar previews webp automáticamente"
            git push
          fi
