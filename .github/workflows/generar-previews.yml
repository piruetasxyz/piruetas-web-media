name: Generar árboles, gráficos, previews webp y redes sociales

on:
  workflow_dispatch: {}
  # una vez al día, para redibujar árboles y gráficos cuando cambian
  # los repositorios de las bibliotecas o sale una versión nueva
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
    paths:
      - "**/jpg/*.jpg"
      - "**/jpg/*.jpeg"
      - "**/png/*.png"
      - "**/svg/*.svg"
      - "**/arbol/*.yaml"
      - "scripts/generar-arboles.js"
      - "**/grafico/*.yaml"
      - "scripts/generar-graficos.js"
      - "scripts/simuladores/*.cpp"
      - "scripts/generar-webp.sh"
      - "scripts/generar-redes-sociales.sh"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar árboles (svg/*.svg) desde arbol/*.yaml
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generar-arboles.js

      - name: Generar gráficos (svg/*.svg) desde grafico/*.yaml, compilando cada biblioteca
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generar-graficos.js

      - name: Instalar cwebp, rsvg-convert e ImageMagick
        run: sudo apt-get update && sudo apt-get install -y webp librsvg2-bin imagemagick

      - name: Generar webp desde jpg
        run: ./scripts/generar-webp.sh

      - name: Generar previews de redes sociales (redes/*.jpg) desde jpg, png y svg
        run: ./scripts/generar-redes-sociales.sh

      - name: Commitear previews generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar árboles, gráficos, previews webp y redes sociales automáticamente"
            git push
          fi
