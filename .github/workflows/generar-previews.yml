name: Generar previews webp y redes sociales

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "**/jpg/*.jpg"
      - "**/jpg/*.jpeg"
      - "**/png/*.png"
      - "**/svg/*.svg"
      - "scripts/generar-webp.sh"
      - "scripts/generar-redes-sociales.sh"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar cwebp, rsvg-convert e ImageMagick
        run: sudo apt-get update && sudo apt-get install -y webp librsvg2-bin imagemagick

      - name: Generar webp desde jpg
        run: ./scripts/generar-webp.sh

      - name: Generar previews de redes sociales (redes/*.jpg) desde jpg, png y svg
        run: ./scripts/generar-redes-sociales.sh

      - name: Commitear previews generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar previews webp y redes sociales automáticamente"
            git push
          fi
