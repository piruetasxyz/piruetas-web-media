# Fuente del diagrama de flujo de señal de la biblioteca Boton
# (https://github.com/piruetasxyz/Boton). scripts/generar-diagramas.js
# lo dibuja en ../svg/boton-diagrama.svg, con el mismo lenguaje visual
# que los esquemáticos de KiCad (ej. 2026-piruetas-chufe).
titulo: 'boton'
archivo: 'src/Boton.h'
revision: 'v0.1.0'
fecha: '2026-10-06'

# de izquierda a derecha
entrada:
  tipo: 'boton'
  ref: 'SW1'
  valor: 'botón'
  alimentacion: '+3V3'
  resistencia:
    ref: 'R1'
    valor: 'pull-up interna'

etapas:
  - ref: 'U1'
    nombre: 'Boton(3)'
    notas:
      - 'entrada con'
      - 'pull-up'
    cable: 'patita 3'
  - ref: 'U2'
    nombre: 'actualizar()'
    notas:
      - 'antirrebote'
      - '50 ms estable'
    cable: 'lectura'
  - ref: 'U3'
    nombre: 'getValor()'
    notas:
      - 'true: suelto'
      - 'false: presionado'
    cable: 'valor'

salida: 'bool'
